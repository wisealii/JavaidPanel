name: Repository verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and pinned source checksum
        shell: bash
        run: |
          bash -n install.sh
          bash -n installer/core.sh
          bash -n node-agent-install.sh
          printf '%s  %s\n' '242a44d0b5089235667f009f3d86702a4bbe51a27f1f4d146f21f67d92eb6155' 'installer/core.sh' | sha256sum --check
      - name: Installer self-test (no system changes)
        run: bash install.sh --self-test
      - name: Test embedded Gateway presentation compatibility
        run: python3 -m unittest discover -s tests -p 'test_gateway_branding.py' -v
      - name: Run offline bootstrap regression tests
        run: python3 -m unittest discover -s tests -p 'test_bootstrap.py' -v
      - name: Unit tests for offline Javid Node enrollment core
        run: python3 -m unittest discover -s tests -p 'test_node_enrollment.py' -v
      - name: Test authenticated node API and replay-resistant heartbeat
        run: python3 -m unittest discover -s tests -p 'test_node_api.py' -v
      - name: Test guided SSL wizard and installer shell syntax
        run: python3 -m unittest discover -s tests -p 'test_ssl_wizard.py' -v
      - name: Test private authenticated node dashboard
        run: python3 -m unittest discover -s tests -p 'test_node_dashboard.py' -v
      - name: Test safe controller upgrade + rollback
        run: python3 -m unittest discover -s tests -p 'test_node_upgrade.py' -v
      - name: Test release-readiness detection and fail on source blockers
        run: |
          python3 -m unittest discover -s tests -p 'test_release_readiness.py' -v
          python3 tools/release-readiness.py --json
      - name: Audit only existing capabilities with source evidence
        run: |
          python3 tools/audit-current-features.py --json
          python3 -m unittest discover -s tests -p 'test_current_features_audit.py' -v
      - name: Offline regression tests for VPS post-install smoke check
        run: |
          python3 tools/vps-postinstall-smoke.py --check
          python3 -m unittest discover -s tests -p 'test_vps_postinstall_smoke.py' -v
      - name: Validate version history and release archive
        run: |
          python3 tools/version-archive.py --check
          python3 -m unittest discover -s tests -p 'test_version_archive.py' -v
      - name: Validate per-version archive and machine-readable catalog
        run: |
          python3 tools/verify-version-catalog.py
          python3 -m unittest discover -s tests -p 'test_version_catalog.py' -v
      - name: Validate docs and landing page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Validator(HTMLParser): pass
          source=Path("docs/index.html").read_text()
          Validator().feed(source)
          demo=Path("docs/demo.html").read_text(encoding="utf-8")
          Validator().feed(demo)
          assert 'DEMO' in demo and 'JavaidPanel' in demo
          for ref in ['FEATURES.md','NODES.md','NODE_ENROLLMENT.md','SSL.md','ROADMAP.md','TROUBLESHOOTING.md','DEVELOPMENT.md']:
              assert Path('docs',ref).is_file(), ref
          assert "JavaidPanel" in source
          for path in ["LICENSE","SOURCES.md","docs/INSTALLATION.md","docs/STATUS.md"]:
              assert Path(path).is_file(),path
          PY
